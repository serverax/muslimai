apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/environment: staging
    app.kubernetes.io/name: ollama-preload
    app.kubernetes.io/part-of: sakina-mobile
  name: sakina-ollama-preload
  namespace: sakina-mobile-staging
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: staging
        app.kubernetes.io/name: ollama-preload
        app.kubernetes.io/part-of: sakina-mobile
    spec:
      containers:
      - command:
        - /bin/sh
        - -ec
        - |
          set -euo pipefail
          model="tinyllama"
          attempts=0
          until curl -fsS http://sakina-ollama:11434/api/tags >/tmp/ollama-tags.json; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 60 ]; then
              echo "sakina-ollama did not become reachable for model preload"
              exit 1
            fi
            sleep 5
          done
          curl -fsS http://sakina-ollama:11434/api/pull \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${model}\",\"stream\":false}"
          curl -fsS http://sakina-ollama:11434/api/tags | grep -i "${model}"
        image: curlimages/curl:8.8.0
        imagePullPolicy: IfNotPresent
        name: preload
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - emptyDir: {}
        name: tmp
  ttlSecondsAfterFinished: 3600
