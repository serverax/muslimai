          value: /opt/sakina/wasm/sakina_validator.wasm
        image: ghcr.io/serverax/sakina-backend:qa-security-hardening
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        name: retrieval
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          limits:
            cpu: 750m
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /opt/sakina/wasm
          name: agent-validator-wasm
          readOnly: true
      imagePullSecrets:
      - name: ghcr-pull-secret
      initContainers:
      - command:
        - /bin/sh
        - -c
        - cp /usr/local/share/sakina/wasm/sakina_validator.wasm /agent-wasm/sakina_validator.wasm
          && test -s /agent-wasm/sakina_validator.wasm
        image: ghcr.io/serverax/sakina-backend:qa-security-hardening
        imagePullPolicy: Always
        name: install-agent-validator-wasm
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /agent-wasm
          name: agent-validator-wasm
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: agent-validator-wasm
---
