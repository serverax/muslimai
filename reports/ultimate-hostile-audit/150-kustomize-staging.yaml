apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: staging
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: sakina-mobile
  name: sakina-admin
  namespace: sakina-mobile-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakina-admin
      app.kubernetes.io/environment: staging
      app.kubernetes.io/part-of: sakina-mobile
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sakina-admin
        app.kubernetes.io/environment: staging
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: sakina-mobile
    spec:
      containers:
      - image: ghcr.io/serverax/sakina-frontend:qa-security-hardening
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 15
        name: admin
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/cache/nginx
          name: nginx-cache
        - mountPath: /var/run
          name: nginx-run
      imagePullSecrets:
      - name: ghcr-pull-secret
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: nginx-cache
      - emptyDir: {}
        name: nginx-run
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: staging
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: sakina-mobile
  name: sakina-backend
  namespace: sakina-mobile-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sakina-backend
      app.kubernetes.io/environment: staging
      app.kubernetes.io/part-of: sakina-mobile
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sakina-backend
        app.kubernetes.io/environment: staging
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: sakina-mobile
    spec:
      containers:
      - env:
        - name: SAKINA_ENV
          value: staging
        - name: SAKINA_LLM_ENABLED
          value: "true"
        - name: SAKINA_LLM_GATEWAY_URL
          value: http://sakina-llm-gateway:8087
        - name: SAKINA_LLM_MODEL
          value: tinyllama
        - name: OLLAMA_CPU_MODE
          value: "true"
        - name: OLLAMA_DEFAULT_MODEL
          value: tinyllama
        - name: OLLAMA_TIMEOUT_SECONDS
          value: "60"
        - name: SAKINA_LLM_TIMEOUT_SECONDS
          value: "60"
        - name: SAKINA_MODEL_LEARNING
          value: "false"
        - name: SAKINA_PRIVATE_MEMORY
          value: "false"
        - name: SAKINA_ANONYMOUS_LEARNING
          value: "true"
        - name: POSTGRES_HOST
          value: sakina-postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: sakina-postgres-secret
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: sakina-postgres-secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: sakina-postgres-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: jwt-secret
              name: sakina-staging-secrets
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: encryption-key
              name: sakina-staging-secrets
        - name: QDRANT_URL
          value: http://sakina-qdrant:6333
        - name: QDRANT_COLLECTION
          value: sakina_islamic_chunks_en
        - name: ISLAMIC_QDRANT_COLLECTION
          value: sakina_islamic_chunks_en
        - name: SAKINA_REDIS_URL
          value: redis://sakina-redis:6379
        - name: SAKINA_AGENT_ROLLOUT_PROBE_ENABLED
          value: "true"
        - name: SAKINA_VALIDATOR_WASM_PATH
          value: /opt/sakina/wasm/sakina_validator.wasm
        image: ghcr.io/serverax/sakina-backend:qa-security-hardening
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
        name: backend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /opt/sakina/wasm
          name: agent-validator-wasm
          readOnly: true
      imagePullSecrets:
      - name: ghcr-pull-secret
      initContainers:
      - command:
        - /bin/sh
        - -c
        - cp /usr/local/share/sakina/wasm/sakina_validator.wasm /agent-wasm/sakina_validator.wasm
          && test -s /agent-wasm/sakina_validator.wasm
        image: ghcr.io/serverax/sakina-backend:qa-security-hardening
        imagePullPolicy: Always
        name: install-agent-validator-wasm
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /agent-wasm
          name: agent-validator-wasm
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: agent-validator-wasm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: staging
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: sakina-mobile
  name: sakina-llm-gateway
  namespace: sakina-mobile-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakina-llm-gateway
      app.kubernetes.io/environment: staging
      app.kubernetes.io/part-of: sakina-mobile
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sakina-llm-gateway
        app.kubernetes.io/environment: staging
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/part-of: sakina-mobile
    spec:
      containers:
      - command:
        - sakina-llm-gateway
        env:
        - name: SAKINA_ENV
          value: staging
        - name: OLLAMA_BASE_URL
          value: http://sakina-ollama:11434
        - name: SAKINA_LLM_MODEL
          value: tinyllama
        - name: SAKINA_LLM_TIMEOUT_SECONDS
          value: "60"
        - name: SAKINA_LLM_GATEWAY_BIND
          value: 0.0.0.0:8087
        - name: RUST_LOG
          value: info
        image: ghcr.io/serverax/sakina-backend:qa-security-hardening
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
        name: llm-gateway
        ports:
        - containerPort: 8087
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
      imagePullSecrets:
      - name: ghcr-pull-secret
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: staging
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: sakina-mobile
  name: sakina-ollama
  namespace: sakina-mobile-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakina-ollama
      app.kubernetes.io/environment: staging
      app.kubernetes.io/part-of: sakina-mobile
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sakina-ollama
        app.kubernetes.io/environment: staging
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: sakina-mobile
    spec:
      containers:
      - env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        image: ollama/ollama
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/tags
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        name: ollama
        ports:
        - containerPort: 11434
          name: http
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /api/tags
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "2"
            memory: 6Gi
          requests:
            cpu: 250m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-models
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: sakina-ollama-models
---
