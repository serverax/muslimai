name: sakina-rag-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "sakina-rag/**"
      - ".github/workflows/sakina-rag-ci.yml"
  pull_request:
    paths:
      - "sakina-rag/**"
      - ".github/workflows/sakina-rag-ci.yml"

permissions:
  contents: read

jobs:
  rag-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run RAG tests
        run: |
          pytest -q sakina-rag/tests

      - name: Build RAG image
        run: |
          docker build -f sakina-rag/Dockerfile -t sakina-rag-ci:${{ github.sha }} .
