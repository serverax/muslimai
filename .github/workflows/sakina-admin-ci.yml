name: sakina-admin-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "sakina-dashboard/admin/**"
      - "admin/Dockerfile"
      - ".github/workflows/sakina-admin-ci.yml"
  pull_request:
    paths:
      - "sakina-dashboard/admin/**"
      - "admin/Dockerfile"
      - ".github/workflows/sakina-admin-ci.yml"

permissions:
  contents: read

jobs:
  admin-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate admin source syntax
        run: |
          node --check sakina-dashboard/admin/src/index.js

      - name: Build admin image
        run: |
          docker build -f admin/Dockerfile -t sakina-admin-ci:${{ github.sha }} .
