name: sakina-ios-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"

      - name: Verify iOS target exists
        run: |
          if [[ ! -d sakina-frontend/ios ]]; then
            echo "sakina-frontend/ios is missing. Restore the iOS target before this workflow can succeed."
            exit 1
          fi

      - name: Check Apple signing secrets
        run: |
          required=(
            APPLE_TEAM_ID
            APPLE_BUNDLE_ID
            APPLE_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_PROVISIONING_PROFILE_BASE64
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
          )
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key}" ]]; then
              missing+=("${key}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Apple signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install Flutter dependencies
        run: |
          cd sakina-frontend
          flutter pub get

      - name: Stage Apple signing materials
        run: |
          cd sakina-frontend/ios
          mkdir -p ci-signing
          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > ci-signing/apple_distribution.cer
          printf '%s' "${APPLE_PROVISIONING_PROFILE_BASE64}" | base64 --decode > ci-signing/sakina.mobileprovision
          printf '%s' "${APP_STORE_CONNECT_API_KEY_BASE64}" | base64 --decode > ci-signing/app_store_connect_api_key.p8
          cat > ci-signing/README.txt <<EOF
          Bundle ID: ${APPLE_BUNDLE_ID}
          Team ID: ${APPLE_TEAM_ID}
          Apple signing materials staged for manual Xcode integration.
          EOF

      - name: Build iOS without code signing
        run: |
          cd sakina-frontend
          flutter build ios --release --no-codesign --dart-define=SAKINA_API_BASE_URL=https://api.7jzi.com/v1

      - name: Upload iOS build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakina-ios-build-artifacts
          path: |
            sakina-frontend/build/ios/**
            sakina-frontend/ios/ci-signing/**
          if-no-files-found: ignore
