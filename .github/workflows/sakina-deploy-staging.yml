name: sakina-deploy-staging

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_NAMESPACE: sakina-mobile-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify namespace guardrails
        run: |
          bash scripts/sakina/verify-single-namespace.sh

      - name: Verify staged files for secret leaks
        run: |
          bash scripts/sakina/verify-no-secret-leak.sh --all-files

      - name: Configure kubeconfig
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${{ secrets.ORDINOX_TALOS_KUBECONFIG_B64 }}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Deploy staging manifests
        env:
          EXPECTED_KUBE_CONTEXT: ${{ secrets.ORDINOX_TALOS_CONTEXT }}
        run: |
          bash scripts/sakina/deploy-staging.sh

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${{ secrets.ORDINOX_TALOS_KUBECONFIG_B64 }}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Run staging smoke tests
        env:
          EXPECTED_KUBE_CONTEXT: ${{ secrets.ORDINOX_TALOS_CONTEXT }}
        run: |
          bash scripts/sakina/smoke-staging.sh

  fail-closed:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ always() }}
    steps:
      - name: Fail closed on any failed smoke test
        run: |
          if [[ "${{ needs.smoke.result }}" != "success" ]]; then
            echo "Smoke validation failed; deployment is not accepted."
            exit 1
          fi
          echo "Smoke validation completed with real command assertions."
