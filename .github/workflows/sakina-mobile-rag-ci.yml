name: sakina-mobile-rag-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sakina-rag/**'

jobs:
  rag-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run RAG tests
        run: pytest sakina-rag/tests -q
