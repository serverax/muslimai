name: sakina-android-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"

      - name: Install dependencies
        run: |
          cd sakina-frontend
          flutter pub get

      - name: Verify Android signing secrets
        run: |
          missing=()
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              missing+=("${key}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Android signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Materialize keystore and key.properties
        run: |
          cd sakina-frontend/android
          mkdir -p keystore
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > keystore/upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=../keystore/upload-keystore.jks
          EOF

      - name: Build release AAB
        run: |
          cd sakina-frontend
          flutter build appbundle --release --dart-define=SAKINA_API_BASE_URL=https://api.7jzi.com/v1

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakina-android-release-aab
          path: sakina-frontend/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
