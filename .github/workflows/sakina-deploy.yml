name: Sakina Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

  push:
    branches:
      - qa-security-hardening

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      STAGING_NAMESPACE: ${{ secrets.SAKINA_STAGING_NAMESPACE }}
      PROD_NAMESPACE: ${{ secrets.SAKINA_PROD_NAMESPACE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.SAKINA_KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Select namespace
        id: ns
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "namespace=${STAGING_NAMESPACE}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "namespace=${PROD_NAMESPACE}" >> "$GITHUB_OUTPUT"
          else
            echo "namespace=${STAGING_NAMESPACE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm cluster and namespace
        run: |
          kubectl get nodes -o wide
          kubectl get ns "${{ steps.ns.outputs.namespace }}"
          kubectl -n "${{ steps.ns.outputs.namespace }}" get all

      - name: Apply Kubernetes manifests
        run: |
          echo "Searching for Kubernetes manifest folders..."

          CANDIDATES="
          sakina-infra/k8s
          sakina-infra/kubernetes
          sakina-infra/manifests
          sakina-infra
          k8s
          kubernetes
          manifests
          deploy
          deployment
          "

          FOUND="false"

          for dir in $CANDIDATES; do
            if [ -d "$dir" ] && find "$dir" -type f \( -name "*.yaml" -o -name "*.yml" \) | grep -q .; then
              echo "Applying manifests from: $dir"
              kubectl -n "${{ steps.ns.outputs.namespace }}" apply -f "$dir" --recursive
              FOUND="true"
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: No Kubernetes manifest folder found."
            echo "Available YAML files:"
            find . -type f \( -name "*.yaml" -o -name "*.yml" \) | sort
            exit 1
          fi

      - name: Restart Sakina deployments
        run: |
          kubectl -n "${{ steps.ns.outputs.namespace }}" rollout restart deployment || true

      - name: Confirm rollout
        run: |
          kubectl -n "${{ steps.ns.outputs.namespace }}" get all
          kubectl -n "${{ steps.ns.outputs.namespace }}" rollout status deployment/sakina-backend --timeout=180s || true
          kubectl -n "${{ steps.ns.outputs.namespace }}" rollout status deployment/sakina-admin --timeout=180s || true
          kubectl -n "${{ steps.ns.outputs.namespace }}" rollout status deployment/sakina-rag-ingestion --timeout=180s || true
          kubectl -n "${{ steps.ns.outputs.namespace }}" rollout status deployment/sakina-rag-retrieval --timeout=180s || true
          kubectl -n "${{ steps.ns.outputs.namespace }}" rollout status deployment/sakina-frontend --timeout=180s || true
          kubectl -n "${{ steps.ns.outputs.namespace }}" rollout status deployment/sakina-landing --timeout=180s || true

      - name: Show recent events if needed
        if: always()
        run: |
          kubectl -n "${{ steps.ns.outputs.namespace }}" get events --sort-by=.lastTimestamp | tail -80
