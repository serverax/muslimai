name: Sakina Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

  push:
    branches:
      - qa-security-hardening

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      STAGING_NAMESPACE: ${{ secrets.SAKINA_STAGING_NAMESPACE }}
      PROD_NAMESPACE: ${{ secrets.SAKINA_PROD_NAMESPACE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.SAKINA_KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Select namespace
        id: ns
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "namespace=${STAGING_NAMESPACE}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "namespace=${PROD_NAMESPACE}" >> "$GITHUB_OUTPUT"
          else
            echo "namespace=${STAGING_NAMESPACE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm cluster and namespace
        run: |
          kubectl get nodes -o wide
          kubectl get ns "${{ steps.ns.outputs.namespace }}"
          kubectl -n "${{ steps.ns.outputs.namespace }}" get all

      - name: Apply Kubernetes manifests
        run: |
          set -euo pipefail

          dump_deploy_debug() {
            status="$?"
            set +e
            echo "=== Sakina deploy debug: sakina-data resources ==="
            kubectl -n sakina-data get statefulset,pods,pvc,svc -o wide
            echo "=== Sakina deploy debug: qdrant pod description ==="
            kubectl -n sakina-data describe pod qdrant-0
            echo "=== Sakina deploy debug: qdrant logs ==="
            kubectl -n sakina-data logs qdrant-0 --all-containers --tail=200
            echo "=== Sakina deploy debug: sakina-data events ==="
            kubectl -n sakina-data get events --sort-by=.lastTimestamp
            exit "$status"
          }
          trap dump_deploy_debug ERR

          apply_manifest() {
            manifest="$1"
            if [ ! -f "$manifest" ]; then
              echo "ERROR: required Kubernetes manifest is missing: $manifest"
              exit 1
            fi
            echo "Applying Kubernetes manifest: $manifest"
            kubectl apply -f "$manifest"
          }

          echo "Applying Sakina Kubernetes manifests in strict order."
          apply_manifest sakina-infra/manifests/00-namespaces.yaml
          apply_manifest sakina-infra/manifests/brand-configmap.yaml
          kubectl -n sakina-data create configmap postgres-init \
            --from-file=init.sql=sakina-backend/db/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          apply_manifest sakina-infra/manifests/storage-class.yaml

          repair_pending_data_claim() {
            statefulset="$1"
            claim="$2"
            if kubectl -n sakina-data get pvc "$claim" >/dev/null 2>&1; then
              phase="$(kubectl -n sakina-data get pvc "$claim" -o jsonpath='{.status.phase}')"
              storage_class="$(kubectl -n sakina-data get pvc "$claim" -o jsonpath='{.spec.storageClassName}')"
              if [ "$phase" = "Pending" ] && [ "$storage_class" != "local-path" ]; then
                echo "Recreating unbound Sakina data claim $claim for StatefulSet $statefulset."
                if kubectl -n sakina-data get statefulset "$statefulset" >/dev/null 2>&1; then
                  kubectl -n sakina-data delete statefulset "$statefulset" --wait=true
                fi
                kubectl -n sakina-data delete pvc "$claim" --wait=true
              fi
            fi
          }

          repair_pending_data_claim postgres postgres-storage-postgres-0
          repair_pending_data_claim qdrant qdrant-storage-qdrant-0

          apply_manifest sakina-infra/manifests/postgres-deployment.yaml
          apply_manifest sakina-infra/manifests/qdrant-deployment.yaml

          kubectl -n sakina-data rollout status statefulset/postgres --timeout=180s
          kubectl -n sakina-data rollout status statefulset/qdrant --timeout=180s
          kubectl -n sakina-data run sakina-qdrant-health \
            --rm -i --restart=Never --image=curlimages/curl \
            -- curl -fsS http://qdrant.sakina-data.svc.cluster.local:6333/healthz
          kubectl -n sakina-data exec -i postgres-0 -- psql -U sakina_user -d sakina < sakina-backend/db/migrations/013_waitlist.sql
          kubectl -n sakina-data exec postgres-0 -- psql -U sakina_user -d sakina \
            -c "SELECT to_regclass('sakina_ai.waitlist') AS waitlist_table;"

          apply_manifest sakina-infra/manifests/sakina-api-deployment.yaml
          kubectl -n sakina-api rollout status deployment/sakina-api --timeout=180s

          apply_manifest sakina-infra/manifests/sakina-prod/sakina-backend.yaml
          apply_manifest sakina-infra/manifests/sakina-prod/sakina-frontend.yaml
          kubectl -n sakina-prod rollout status deployment/sakina-backend --timeout=180s
          kubectl -n sakina-prod rollout status deployment/sakina-frontend --timeout=180s

          apply_manifest sakina-infra/manifests/monitoring/jaeger.yaml
          apply_manifest sakina-infra/manifests/monitoring/prometheus.yaml
          apply_manifest sakina-infra/manifests/monitoring/grafana.yaml
          apply_manifest sakina-infra/manifests/sakina-prod/sakina-ingress.yaml
          apply_manifest sakina-infra/manifests/network-policies.yaml

      - name: Restart Sakina deployments
        run: |
          found="false"
          for deployment in sakina-backend sakina-admin sakina-rag-ingestion sakina-rag-retrieval sakina-frontend sakina-landing; do
            if kubectl -n "${{ steps.ns.outputs.namespace }}" get deployment "$deployment" >/dev/null 2>&1; then
              kubectl -n "${{ steps.ns.outputs.namespace }}" rollout restart "deployment/$deployment"
              found="true"
            fi
          done
          if [ "$found" != "true" ]; then
            echo "ERROR: no Sakina deployments found for restart"
            kubectl -n "${{ steps.ns.outputs.namespace }}" get deployment
            exit 1
          fi

      - name: Confirm rollout
        run: |
          set -euo pipefail
          kubectl -n "${{ steps.ns.outputs.namespace }}" get all
          required="sakina-backend sakina-admin sakina-rag-ingestion sakina-rag-retrieval"
          if kubectl -n "${{ steps.ns.outputs.namespace }}" get deployment sakina-frontend >/dev/null 2>&1; then
            required="$required sakina-frontend"
          fi
          if kubectl -n "${{ steps.ns.outputs.namespace }}" get deployment sakina-landing >/dev/null 2>&1; then
            required="$required sakina-landing"
          fi
          for deployment in $required; do
            kubectl -n "${{ steps.ns.outputs.namespace }}" get deployment "$deployment"
            kubectl -n "${{ steps.ns.outputs.namespace }}" rollout status "deployment/$deployment" --timeout=180s
          done

      - name: Show recent events if needed
        if: always()
        run: |
          kubectl -n "${{ steps.ns.outputs.namespace }}" get events --sort-by=.lastTimestamp | tail -80
