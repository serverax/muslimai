name: Sakina Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

  push:
    branches:
      - qa-security-hardening

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      STAGING_NAMESPACE: ${{ secrets.SAKINA_STAGING_NAMESPACE }}
      PROD_NAMESPACE: ${{ secrets.SAKINA_PROD_NAMESPACE }}
      SAKINA_STAGING_JWT_SECRET: ${{ secrets.SAKINA_STAGING_JWT_SECRET }}
      SAKINA_STAGING_ENCRYPTION_KEY: ${{ secrets.SAKINA_STAGING_ENCRYPTION_KEY }}
      BACKEND_IMAGE: ghcr.io/serverax/sakina-backend:qa-security-hardening
      FRONTEND_IMAGE: ghcr.io/serverax/sakina-frontend:qa-security-hardening
      SAKINA_OLLAMA_MODEL: qwen2.5:3b

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for image build and pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sakina-backend/Dockerfile.api
          push: true
          tags: |
            ghcr.io/serverax/sakina-backend:${{ github.sha }}
            ghcr.io/serverax/sakina-backend:qa-security-hardening

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/serverax/sakina-frontend:${{ github.sha }}
            ghcr.io/serverax/sakina-frontend:qa-security-hardening

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install staging proof tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "${{ secrets.SAKINA_KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context

      - name: Select namespace
        id: ns
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            namespace="${STAGING_NAMESPACE:-sakina-mobile-staging}"
          elif [ "${{ github.event.inputs.environment }}" = "production" ]; then
            namespace="${PROD_NAMESPACE:-sakina-mobile-staging}"
          else
            namespace="${STAGING_NAMESPACE:-sakina-mobile-staging}"
          fi
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "Selected namespace: $namespace"

      - name: Confirm cluster access
        run: |
          set -euo pipefail
          kubectl get nodes -o wide
          kubectl describe nodes | grep -E "Name:|Taints:|Allocatable:|pods:"
          kubectl get ns

      - name: Confirm GHCR images and credentials
        run: |
          set -euo pipefail
          ghcr_user="${{ github.actor }}"
          ghcr_token="${{ github.token }}"
          printf '%s' "$ghcr_token" | docker login ghcr.io -u "$ghcr_user" --password-stdin
          docker manifest inspect "$BACKEND_IMAGE" >/dev/null
          docker manifest inspect "$FRONTEND_IMAGE" >/dev/null
          echo "GHCR public images are reachable with workflow package credentials."

      - name: Apply Kubernetes manifests in strict order
        run: |
          set -euo pipefail
          namespace="${{ steps.ns.outputs.namespace }}"
          manifest_root="infra/k8s/sakina-mobile-staging"

          require_file() {
            manifest="$1"
            if [ ! -f "$manifest" ]; then
              echo "ERROR: required Kubernetes manifest is missing: $manifest"
              exit 1
            fi
          }

          apply_file() {
            manifest="$1"
            require_file "$manifest"
            echo "Applying Kubernetes manifest: $manifest"
            kubectl apply -f "$manifest"
          }

          ensure_statefulset() {
            sts_name="$1"
            manifest="$2"
            require_file "$manifest"
            if kubectl -n "$namespace" get statefulset "$sts_name" >/dev/null 2>&1; then
              echo "Reusing existing statefulset/$sts_name in $namespace; immutable StatefulSet fields are not reapplied."
            else
              echo "Creating statefulset/$sts_name from $manifest"
              kubectl apply -f "$manifest"
            fi
            kubectl -n "$namespace" rollout status "statefulset/$sts_name" --timeout=180s
          }

          wait_job() {
            job_name="$1"
            if ! kubectl -n "$namespace" wait --for=condition=complete "job/$job_name" --timeout=600s; then
              echo "ERROR: job/$job_name did not complete; collecting diagnostics before failing"
              kubectl -n "$namespace" get job "$job_name" -o wide
              kubectl -n "$namespace" describe job "$job_name"
              kubectl -n "$namespace" get pods -l "job-name=$job_name" -o wide
              pod_names="$(kubectl -n "$namespace" get pods -l "job-name=$job_name" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
              if [ -n "$pod_names" ]; then
                while IFS= read -r pod_name; do
                  if [ -n "$pod_name" ]; then
                    echo "Describing pod/$pod_name for job/$job_name"
                    kubectl -n "$namespace" describe pod "$pod_name"
                  fi
                done <<< "$pod_names"
              else
                echo "No pods found for job/$job_name"
              fi
              echo "Recent namespace events for $namespace"
              kubectl -n "$namespace" get events --sort-by=.lastTimestamp | tail -80
              if kubectl -n "$namespace" logs "job/$job_name" --all-containers --tail=200; then
                echo "Collected logs for job/$job_name"
              else
                echo "No logs were available for job/$job_name"
              fi
              exit 1
            fi
            kubectl -n "$namespace" logs "job/$job_name" --all-containers --tail=200
          }

          diagnose_deployment() {
            deploy_name="$1"
            echo "Deployment diagnostics for deployment/$deploy_name"
            kubectl -n "$namespace" get deployment "$deploy_name" -o wide
            kubectl -n "$namespace" describe deployment "$deploy_name"
            kubectl -n "$namespace" get replicaset -l "app=$deploy_name" -o wide
            kubectl -n "$namespace" get pods -l "app=$deploy_name" -o wide
            pod_names="$(kubectl -n "$namespace" get pods -l "app=$deploy_name" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
            if [ -n "$pod_names" ]; then
              while IFS= read -r pod_name; do
                if [ -n "$pod_name" ]; then
                  echo "Describing pod/$pod_name for deployment/$deploy_name"
                  kubectl -n "$namespace" describe pod "$pod_name"
                  echo "Logs for pod/$pod_name"
                  if kubectl -n "$namespace" logs "$pod_name" --all-containers --tail=120; then
                    echo "Collected logs for pod/$pod_name"
                  else
                    echo "No logs were available for pod/$pod_name"
                  fi
                  if [ "$deploy_name" = "sakina-backend" ]; then
                    ready_pf_log="/tmp/sakina-backend-ready-${pod_name}.log"
                    echo "Readiness body for pod/$pod_name"
                    kubectl -n "$namespace" port-forward "pod/$pod_name" 18081:8080 >"$ready_pf_log" 2>&1 &
                    ready_pf_pid="$!"
                    ready_pf_started="false"
                    for attempt in $(seq 1 30); do
                      if curl -sS -i http://127.0.0.1:18081/health/ready; then
                        ready_pf_started="true"
                        break
                      fi
                      sleep 1
                    done
                    kill "$ready_pf_pid" >/dev/null 2>&1
                    if [ "$ready_pf_started" != "true" ]; then
                      echo "Could not fetch /health/ready body for pod/$pod_name"
                      cat "$ready_pf_log"
                    fi
                  fi
                fi
              done <<< "$pod_names"
            else
              echo "No pods found for deployment/$deploy_name"
            fi
            echo "Recent namespace events for $namespace"
            kubectl -n "$namespace" get events --sort-by=.lastTimestamp | tail -120
          }

          diagnose_daemonset() {
            ds_name="$1"
            echo "DaemonSet diagnostics for daemonset/$ds_name"
            kubectl -n "$namespace" get daemonset "$ds_name" -o wide
            kubectl -n "$namespace" describe daemonset "$ds_name"
            kubectl -n "$namespace" get pods -l "app=$ds_name" -o wide
            pod_names="$(kubectl -n "$namespace" get pods -l "app=$ds_name" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
            if [ -n "$pod_names" ]; then
              while IFS= read -r pod_name; do
                if [ -n "$pod_name" ]; then
                  echo "Describing pod/$pod_name for daemonset/$ds_name"
                  kubectl -n "$namespace" describe pod "$pod_name"
                  echo "Logs for pod/$pod_name"
                  if kubectl -n "$namespace" logs "$pod_name" --all-containers --tail=200; then
                    echo "Collected logs for pod/$pod_name"
                  else
                    echo "No logs were available for pod/$pod_name"
                  fi
                fi
              done <<< "$pod_names"
            else
              echo "No pods found for daemonset/$ds_name"
            fi
            if kubectl -n "$namespace" get pvc sakina-ollama-models >/dev/null 2>&1; then
              kubectl -n "$namespace" get pvc sakina-ollama-models -o wide
              kubectl -n "$namespace" describe pvc sakina-ollama-models
            fi
            echo "Recent namespace events for $namespace"
            kubectl -n "$namespace" get events --sort-by=.lastTimestamp | tail -120
          }

          rollout_deployment() {
            deploy_name="$1"
            replicas="${2:-1}"
            echo "Rolling out deployment/$deploy_name"
            kubectl -n "$namespace" scale deployment "$deploy_name" --replicas="$replicas"
            if ! kubectl -n "$namespace" rollout status "deployment/$deploy_name" --timeout=240s; then
              echo "ERROR: deployment/$deploy_name did not roll out"
              diagnose_deployment "$deploy_name"
              exit 1
            fi
            kubectl -n "$namespace" get endpoints "$deploy_name" -o wide
          }

          delete_stale_placeholder_workloads() {
            echo "Deleting stale placeholder distributed services that are not part of the accepted staging kustomization"
            stale_workloads=(
              sakina-api-gateway
              sakina-auth-service
              sakina-user-workspace-service
              sakina-ask-shaikh-service
              sakina-mother-algorithm-service
              sakina-aia-orchestrator-service
              sakina-audit-service
              sakina-citation-guard-service
              sakina-document-service
              sakina-islamic-knowledge-service
              sakina-notification-service
              sakina-psychology-support-service
              sakina-rag-ingestion-service
              sakina-rag-retrieval-service
              sakina-safety-policy-service
              ollama-inference
            )
            for workload in "${stale_workloads[@]}"; do
              kubectl -n "$namespace" delete deployment "$workload" --ignore-not-found=true
              kubectl -n "$namespace" delete service "$workload" --ignore-not-found=true
              kubectl -n "$namespace" delete daemonset "$workload" --ignore-not-found=true
            done
          }

          jwt_secret="${SAKINA_STAGING_JWT_SECRET:-}"
          encryption_key="${SAKINA_STAGING_ENCRYPTION_KEY:-}"

          echo "1. namespaces"
          apply_file "$manifest_root/namespace.yaml"
          kubectl get ns "$namespace"
          delete_stale_placeholder_workloads

          echo "2. secrets/configmaps"
          if kubectl -n "$namespace" get secret sakina-postgres-secret >/dev/null 2>&1; then
            echo "Using existing sakina-postgres-secret in $namespace"
          else
            echo "ERROR: sakina-postgres-secret must exist before deployment; create it out of band without printing secret values"
            exit 1
          fi

          if kubectl -n "$namespace" get secret sakina-staging-secrets >/dev/null 2>&1; then
            echo "Using existing sakina-staging-secrets in $namespace"
          else
            if [ ${#jwt_secret} -lt 32 ]; then
              jwt_secret="$(openssl rand -base64 48)"
              echo "Generated staging JWT secret because SAKINA_STAGING_JWT_SECRET is not configured"
            fi
            if [ ${#encryption_key} -lt 32 ]; then
              encryption_key="$(openssl rand -base64 48)"
              echo "Generated staging encryption key because SAKINA_STAGING_ENCRYPTION_KEY is not configured"
            fi
            kubectl -n "$namespace" create secret generic sakina-staging-secrets \
              --from-literal=jwt-secret="$jwt_secret" \
              --from-literal=encryption-key="$encryption_key" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          kubectl -n "$namespace" get secret sakina-postgres-secret
          kubectl -n "$namespace" get secret sakina-staging-secrets
          kubectl -n "$namespace" delete secret ghcr-creds --ignore-not-found=true
          kubectl -n "$namespace" create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ github.token }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$namespace" get secret ghcr-pull-secret

          echo "3. storage/PVC/PV and statefulsets"
          ensure_statefulset sakina-postgres "$manifest_root/postgres.yaml"
          kubectl -n "$namespace" patch service sakina-postgres --type=json -p='[{"op":"replace","path":"/spec/selector","value":{"app":"sakina-postgres"}}]'
          kubectl -n "$namespace" get endpoints sakina-postgres -o wide
          ensure_statefulset sakina-qdrant "$manifest_root/qdrant.yaml"
          apply_file "$manifest_root/redis.yaml"
          kubectl -n "$namespace" rollout status deployment/sakina-redis --timeout=180s

          echo "3b. free staging pod capacity before Ollama preload and migration jobs"
          for deploy in sakina-backend sakina-admin sakina-rag-ingestion sakina-rag-retrieval sakina-llm-gateway; do
            if kubectl -n "$namespace" get deployment "$deploy" >/dev/null 2>&1; then
              echo "Scaling deployment/$deploy to zero before Ollama preload and migrations to avoid surge pods on the constrained staging cluster"
              kubectl -n "$namespace" scale deployment "$deploy" --replicas=0
              kubectl -n "$namespace" rollout status "deployment/$deploy" --timeout=120s
            else
              echo "deployment/$deploy does not exist yet; no pre-job scale-down needed"
            fi
          done
          echo "Deleting terminal proof pods so the PVC-bound Ollama replacement pod has pod-count capacity on the eligible node"
          kubectl -n "$namespace" delete pod --field-selector=status.phase=Succeeded
          kubectl -n "$namespace" delete pod --field-selector=status.phase=Failed
          kubectl -n "$namespace" get pods -o wide

          echo "3c. Ollama CPU-only Kubernetes service"
          kubectl -n "$namespace" delete daemonset ollama-inference --ignore-not-found=true
          kubectl -n "$namespace" delete daemonset sakina-ollama --ignore-not-found=true
          kubectl -n "$namespace" delete deployment ollama --ignore-not-found=true
          kubectl -n "$namespace" delete deployment sakina-ollama --ignore-not-found=true
          echo "Deleting stale Ollama pods so only the current PVC-backed Deployment spec remains"
          kubectl -n "$namespace" delete pod -l app=sakina-ollama --wait=false
          kubectl -n "$namespace" delete pod -l app=ollama-inference --wait=false
          for attempt in $(seq 1 90); do
            ollama_pods="$(kubectl -n "$namespace" get pods -l app=sakina-ollama --no-headers 2>/dev/null | wc -l | tr -d ' ')"
            inference_pods="$(kubectl -n "$namespace" get pods -l app=ollama-inference --no-headers 2>/dev/null | wc -l | tr -d ' ')"
            if [ "$ollama_pods" = "0" ] && [ "$inference_pods" = "0" ]; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "ERROR: stale Ollama pods did not terminate before PVC rebind"
              kubectl -n "$namespace" get pods -l app=sakina-ollama -o wide
              kubectl -n "$namespace" get pods -l app=ollama-inference -o wide
              exit 1
            fi
            sleep 2
          done
          echo "Recreating staging Ollama model PVC to clear stale local-path node affinity; model preload repopulates qwen2.5:3b"
          kubectl -n "$namespace" delete pvc sakina-ollama-models --ignore-not-found=true
          for attempt in $(seq 1 90); do
            if ! kubectl -n "$namespace" get pvc sakina-ollama-models >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "ERROR: sakina-ollama-models PVC did not delete"
              kubectl -n "$namespace" get pvc sakina-ollama-models -o wide
              kubectl -n "$namespace" describe pvc sakina-ollama-models
              exit 1
            fi
            sleep 2
          done
          apply_file "$manifest_root/ollama.yaml"
          kubectl -n "$namespace" get pods -l app=sakina-ollama -o wide
          kubectl -n "$namespace" get pvc sakina-ollama-models -o wide
          if ! kubectl -n "$namespace" rollout status deployment/sakina-ollama --timeout=600s; then
            echo "ERROR: deployment/sakina-ollama did not roll out"
            diagnose_deployment sakina-ollama
            if kubectl -n "$namespace" get pvc sakina-ollama-models >/dev/null 2>&1; then
              kubectl -n "$namespace" get pvc sakina-ollama-models -o wide
              kubectl -n "$namespace" describe pvc sakina-ollama-models
            fi
            exit 1
          fi
          kubectl -n "$namespace" get deployment sakina-ollama -o wide
          kubectl -n "$namespace" get pods -l app=sakina-ollama -o wide
          kubectl -n "$namespace" get pvc sakina-ollama-models -o wide
          kubectl -n "$namespace" get svc sakina-ollama -o wide
          kubectl -n "$namespace" get endpoints sakina-ollama -o wide

          echo "3d. Ollama model preload"
          kubectl -n "$namespace" delete job sakina-ollama-preload --ignore-not-found=true
          apply_file "$manifest_root/ollama-preload.yaml"
          wait_job sakina-ollama-preload

          echo "3e. Ollama hard smoke tests"
          kubectl -n "$namespace" run "ollama-tags-smoke-$(date +%s)" \
            --pod-running-timeout=180s \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.8.0 \
            --overrides='{"spec":{"tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}}' \
            -- sh -c "curl -fsS http://sakina-ollama:11434/api/tags | tee /tmp/ollama-tags.json && grep -F '${SAKINA_OLLAMA_MODEL}' /tmp/ollama-tags.json"
          kubectl -n "$namespace" run "ollama-generate-smoke-$(date +%s)" \
            --pod-running-timeout=180s \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.8.0 \
            --overrides='{"spec":{"tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}}' \
            -- sh -c "curl -fsS http://sakina-ollama:11434/api/generate \
              -H 'Content-Type: application/json' \
              -d '{\"model\":\"${SAKINA_OLLAMA_MODEL}\",\"prompt\":\"Respond with one short word to prove inference is running.\",\"stream\":false}' \
              | tee /tmp/ollama-generate.json \
              && grep -E '\"response\":\"[^\"]+' /tmp/ollama-generate.json \
              && grep -E '\"done\":true' /tmp/ollama-generate.json"

          echo "4. database jobs"
          kubectl -n "$namespace" delete job sakina-db-migrations --ignore-not-found=true
          backend_sha_image="ghcr.io/serverax/sakina-backend:${{ github.sha }}"
          migration_manifest="$(mktemp)"
          sed "s#ghcr.io/serverax/sakina-backend:qa-security-hardening#$backend_sha_image#g" \
            "$manifest_root/db-migrations.yaml" > "$migration_manifest"
          echo "Applying Kubernetes manifest: $manifest_root/db-migrations.yaml with image $backend_sha_image"
          kubectl apply -f "$migration_manifest"
          wait_job sakina-db-migrations
          echo "Verifying migrated database RLS and Sakina Mother tables"
          kubectl -n "$namespace" exec statefulset/sakina-postgres -- sh -lc '
            set -eu
            export PGPASSWORD="$POSTGRES_PASSWORD"
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              SELECT to_regclass('\''sakina_ai.local_sunni_topics'\'') AS local_sunni_topics,
                     to_regclass('\''sakina_ai.ask_shaikh_answers'\'') AS ask_shaikh_answers,
                     to_regclass('\''sakina_ai.scholar_review_queue'\'') AS scholar_review_queue;
            "
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              SELECT schemaname, tablename
              FROM pg_tables
              WHERE schemaname IN ('\''public'\'','\''sakina_ai'\'','\''audit'\'','\''outbox'\'')
                AND rowsecurity = false
              ORDER BY schemaname, tablename;
            " > /tmp/sakina-rls-disabled.txt
            cat /tmp/sakina-rls-disabled.txt
            if grep -E "^( public| sakina_ai| audit| outbox)[[:space:]]*\\|" /tmp/sakina-rls-disabled.txt; then
              echo "ERROR: RLS disabled tables remain after migrations"
              exit 1
            fi
          '

          echo "5. deployments"
          apply_file "$manifest_root/rag.yaml"
          apply_file "$manifest_root/llm-gateway.yaml"
          apply_file "$manifest_root/backend.yaml"
          apply_file "$manifest_root/admin.yaml"
          echo "Scale runtime deployments to zero before pinning images, then roll them out in dependency order"
          for deploy in sakina-backend sakina-admin sakina-rag-ingestion sakina-rag-retrieval sakina-llm-gateway; do
            kubectl -n "$namespace" scale deployment "$deploy" --replicas=0
            kubectl -n "$namespace" rollout status "deployment/$deploy" --timeout=120s
          done
          echo "Pin runtime deployments to this commit's backend image so Kubernetes pulls the image built by this run"
          kubectl -n "$namespace" set image deployment/sakina-backend \
            backend="$backend_sha_image" \
            install-agent-validator-wasm="$backend_sha_image"
          echo "Remove stale direct Ollama env from backend containers; backend must use only the LLM gateway"
          kubectl -n "$namespace" set env deployment/sakina-backend --containers='*' OLLAMA_BASE_URL- OLLAMA_MODEL-
          kubectl -n "$namespace" set image deployment/sakina-rag-ingestion \
            ingestion="$backend_sha_image" \
            install-agent-validator-wasm="$backend_sha_image"
          kubectl -n "$namespace" set image deployment/sakina-rag-retrieval \
            retrieval="$backend_sha_image" \
            install-agent-validator-wasm="$backend_sha_image"
          kubectl -n "$namespace" set image deployment/sakina-llm-gateway \
            llm-gateway="$backend_sha_image"
          rollout_deployment sakina-llm-gateway
          rollout_deployment sakina-rag-retrieval
          rollout_deployment sakina-rag-ingestion
          rollout_deployment sakina-backend 2
          rollout_deployment sakina-admin

          echo "6. services"
          kubectl -n "$namespace" get svc -o wide

          echo "7. ingress/network policies"
          kubectl -n "$namespace" get ingress -o wide

          echo "8. smoke jobs"
          for job in sakina-staging-smoke; do
            kubectl -n "$namespace" delete job "$job" --ignore-not-found=true
          done
          apply_file "$manifest_root/smoke-tests.yaml"
          wait_job sakina-staging-smoke

      - name: Confirm rollout and pod health
        run: |
          set -euo pipefail
          namespace="${{ steps.ns.outputs.namespace }}"
          rollout_deployment() {
            deploy_name="$1"
            if ! kubectl -n "$namespace" rollout status "deployment/$deploy_name" --timeout=180s; then
              echo "ERROR: deployment/$deploy_name did not roll out during final health confirmation"
              kubectl -n "$namespace" get deployment "$deploy_name" -o wide
              kubectl -n "$namespace" describe deployment "$deploy_name"
              kubectl -n "$namespace" get pods -l "app=$deploy_name" -o wide
              kubectl -n "$namespace" describe pods -l "app=$deploy_name"
              kubectl -n "$namespace" get events --sort-by=.lastTimestamp | tail -120
              exit 1
            fi
          }
          kubectl -n "$namespace" get deploy,ds,sts,svc,pods -o wide
          kubectl -n "$namespace" rollout status deployment/sakina-ollama --timeout=300s
          kubectl -n "$namespace" get deployment sakina-ollama -o wide
          kubectl -n "$namespace" get pods -l app=sakina-ollama -o wide
          kubectl -n "$namespace" get svc sakina-ollama -o wide
          kubectl -n "$namespace" get endpoints sakina-ollama -o wide
          rollout_deployment sakina-llm-gateway
          kubectl -n "$namespace" get deployment sakina-llm-gateway -o yaml | grep -Ei "OLLAMA_BASE_URL|image:|imagePullSecrets|readinessProbe|livenessProbe|resources" -A8 -B5
          kubectl -n "$namespace" logs deployment/sakina-llm-gateway --tail=150
          kubectl -n "$namespace" get deployment sakina-backend -o yaml | grep -Ei "SAKINA_LLM_GATEWAY_URL|OLLAMA_BASE_URL" -A8 -B5
          kubectl -n "$namespace" exec deployment/sakina-backend -- printenv | grep -F "SAKINA_LLM_GATEWAY_URL=http://sakina-llm-gateway:8087"
          if kubectl -n "$namespace" exec deployment/sakina-backend -- printenv | grep -F "OLLAMA_BASE_URL"; then
            echo "ERROR: backend owns OLLAMA_BASE_URL; backend must call sakina-llm-gateway only"
            exit 1
          fi
          kubectl -n "$namespace" run "gateway-health-proof-$(date +%s)" \
            --pod-running-timeout=180s \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.8.0 \
            --overrides='{"spec":{"tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}}' \
            -- curl -fsS http://sakina-llm-gateway:8087/health
          kubectl -n "$namespace" run "gateway-ready-proof-$(date +%s)" \
            --pod-running-timeout=180s \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.8.0 \
            --overrides='{"spec":{"tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}}' \
            -- curl -fsS http://sakina-llm-gateway:8087/ready
          kubectl -n "$namespace" run "gateway-negative-proof-$(date +%s)" \
            --pod-running-timeout=180s \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.8.0 \
            --overrides='{"spec":{"tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}}' \
            -- sh -c 'status="$(curl -sS -o /tmp/body -w "%{http_code}" -X POST http://sakina-llm-gateway:8087/generate -H "Content-Type: application/json" -d "{\"message\":\"test\"}")"; echo "$status"; cat /tmp/body; test "$status" = "400"'
          rollout_deployment sakina-rag-retrieval
          rollout_deployment sakina-rag-ingestion
          rollout_deployment sakina-backend
          rollout_deployment sakina-admin
          bad_pods="$(kubectl -n "$namespace" get pods -o json | jq -r '
            .items[]
            | select((.metadata.ownerReferences // [] | any(.kind == "Job")) | not)
            | select(
                .status.phase == "Pending"
                or .status.phase == "Failed"
                or any(.status.containerStatuses[]?; (.state.waiting.reason // "") == "ImagePullBackOff" or (.state.waiting.reason // "") == "CrashLoopBackOff" or (.state.waiting.reason // "") == "CreateContainerConfigError" or (.state.waiting.reason // "") == "ErrImagePull")
              )
            | "\(.metadata.name)\t\(.status.phase)\t\([.status.containerStatuses[]? | .state.waiting.reason // empty] | join(","))"
          ')"
          if [ -n "$bad_pods" ]; then
            echo "$bad_pods"
            exit 1
          fi

      - name: Run staging agent rollout gate
        run: |
          set -euo pipefail
          chmod +x scripts/sakina/final-staging-agent-rollout-gate.sh
          SAKINA_NS="${{ steps.ns.outputs.namespace }}" bash scripts/sakina/final-staging-agent-rollout-gate.sh

      - name: Run Ask AI Shaikh end-to-end product workflow proof
        run: |
          set -euo pipefail
          namespace="${{ steps.ns.outputs.namespace }}"

          backend_pf_log="/tmp/sakina-backend-port-forward.log"
          postgres_pf_log="/tmp/sakina-postgres-port-forward.log"
          kubectl -n "$namespace" port-forward svc/sakina-backend 18080:8080 >"$backend_pf_log" 2>&1 &
          backend_pf_pid="$!"
          kubectl -n "$namespace" port-forward svc/sakina-postgres 15432:5432 >"$postgres_pf_log" 2>&1 &
          postgres_pf_pid="$!"
          cleanup() {
            set +e
            kill "$backend_pf_pid" "$postgres_pf_pid" >/dev/null 2>&1
            set -e
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health/ready >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/health/ready

          pg_db="$(kubectl -n "$namespace" get secret sakina-postgres-secret -o jsonpath='{.data.POSTGRES_DB}' | base64 -d)"
          pg_user="$(kubectl -n "$namespace" get secret sakina-postgres-secret -o jsonpath='{.data.POSTGRES_USER}' | base64 -d)"
          export PGPASSWORD="$(kubectl -n "$namespace" get secret sakina-postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)"
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 15432 -U "$pg_user" -d "$pg_db" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p 15432 -U "$pg_user" -d "$pg_db"

          export SAKINA_API_BASE_URL="http://127.0.0.1:18080"
          export DATABASE_URL="postgresql://${pg_user}@127.0.0.1:15432/${pg_db}"
          export SAKINA_EVIDENCE_DIR="reports/final-hardening-evidence"
          bash scripts/sakina/final-ask-ai-shaikh-gate.sh

          trace_llm="$(cat reports/final-hardening-evidence/1001-trace-llm.txt)"
          trace_wudu="$(cat reports/final-hardening-evidence/1001-trace-wudu.txt)"
          trace_fatwa="$(cat reports/final-hardening-evidence/1001-trace-fatwa.txt)"

          echo "Backend Brain path log proof for $trace_llm"
          kubectl -n "$namespace" logs -l app=sakina-backend --all-containers --since=20m \
            | tee /tmp/sakina-backend-ask-logs.txt
          grep -F "POST /api/sakina/ask" /tmp/sakina-backend-ask-logs.txt
          echo "Backend Brain DB trace proof for $trace_llm"
          brain_trace_count="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "
            SELECT COUNT(*)
            FROM sakina_ai.brain_decision_traces
            WHERE request_id = '$trace_llm'
              AND selected_agent = 'Mother Algorithm'
              AND selected_model = 'sakina-islamic-support:cpu'
              AND selected_pipeline = 'sakina_mother_algorithm'
              AND source_strategy = 'llm_generation_with_controlled_context'
              AND evaluation_result = 'PASS'
              AND execution_trace @> '[{\"step\":\"rag_checked\",\"outcome\":true},{\"step\":\"graph_rag_checked\",\"outcome\":true},{\"step\":\"llm_used\",\"outcome\":true}]'::jsonb;
          ")"
          echo "Brain trace matching rows=$brain_trace_count"
          test "$brain_trace_count" = "1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            SELECT request_id, workspace_id, selected_agent, selected_model,
                   selected_pipeline, source_strategy, evaluation_result,
                   execution_trace
            FROM sakina_ai.brain_decision_traces
            WHERE request_id = '$trace_llm';
          "

          echo "Gateway-to-Ollama log proof for $trace_llm"
          kubectl -n "$namespace" logs deployment/sakina-llm-gateway --since=20m \
            | tee /tmp/sakina-gateway-ask-logs.txt
          grep -F "$trace_llm" /tmp/sakina-gateway-ask-logs.txt
          grep -F "sakina llm gateway completed" /tmp/sakina-gateway-ask-logs.txt

          echo "DB trace proof summary"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
          SELECT request_id, workspace_id, intent, language, selected_agent,
                 selected_model, selected_pipeline, source_strategy,
                 evaluation_result, final_action
          FROM sakina_ai.brain_decision_traces
          WHERE request_id IN ('$trace_wudu', '$trace_llm', '$trace_fatwa')
          ORDER BY created_at;
          "

          echo "Frontend parser and display wiring proof"
          grep -RIn "Future<SakinaAskResponse> askSakina\|SakinaAskResponse.fromJson\|safetyState\|sourcePath\|citations\|modelProvider\|llmModel" \
            sakina-frontend/lib sakina-frontend/test
          grep -RIn "response.citations\|CitationWidget\|safetyState\|sourcePath" sakina-frontend/lib sakina-frontend/test

      - name: Show recent events
        if: always()
        run: |
          kubectl -n "${{ steps.ns.outputs.namespace }}" get events --sort-by=.lastTimestamp | tail -80
