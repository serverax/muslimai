name: Frontend CI

on:
  push:
    paths:
      - 'sakina-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'sakina-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Get dependencies
        run: |
          cd sakina-frontend
          flutter pub get

      - name: Analyze
        run: |
          cd sakina-frontend
          flutter analyze

      - name: Run tests
        run: |
          cd sakina-frontend
          flutter test

      - name: Verify backend secrets are not referenced in frontend
        run: |
          if rg -n "SUPABASE_SERVICE_ROLE_KEY" sakina-frontend/lib sakina-frontend/test; then
            echo "SUPABASE_SERVICE_ROLE_KEY must never be referenced in frontend code"
            exit 1
          fi

      - name: Build APK
        run: |
          cd sakina-frontend
          flutter build apk --release
