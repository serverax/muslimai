name: Release Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Versioned image tag (e.g. git SHA)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  OWNER: serverax

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: sakina-backend
          file: sakina-backend/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/sakina-backend:${{ inputs.image_tag }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/sakina-frontend:${{ inputs.image_tag }}
