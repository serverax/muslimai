name: sakina-backend-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/serverax/sakina/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          include_latest=false
          latest_tag=""
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ]]; then
            include_latest=true
            latest_tag="${IMAGE_NAME}:latest"
          fi
          {
            echo "short_sha=${short_sha}"
            echo "image=${IMAGE_NAME}"
            echo "sha_tag=${IMAGE_NAME}:${short_sha}"
            echo "include_latest=${include_latest}"
            echo "latest_tag=${latest_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: sakina-backend
          file: sakina-backend/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.sha_tag }}

      - name: Create latest tag on default branch
        if: steps.meta.outputs.include_latest == 'true'
        run: |
          docker buildx imagetools create -t "${{ steps.meta.outputs.latest_tag }}" "${{ steps.meta.outputs.sha_tag }}"

      - name: Verify image exists in GHCR
        run: |
          docker manifest inspect "${{ steps.meta.outputs.sha_tag }}" >/dev/null
          echo "Verified ${{ steps.meta.outputs.sha_tag }}"
          if [[ "${{ steps.meta.outputs.include_latest }}" == "true" ]]; then
            docker manifest inspect "${{ steps.meta.outputs.latest_tag }}" >/dev/null
            echo "Verified ${{ steps.meta.outputs.latest_tag }}"
          fi
