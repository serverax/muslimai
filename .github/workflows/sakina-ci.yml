name: sakina-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sakina-only guard
        run: bash scripts/ensure-sakina-only.sh

  flutter-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"

      - name: Install Flutter dependencies
        run: |
          cd sakina-frontend
          flutter pub get

      - name: Flutter analyze
        run: |
          cd sakina-frontend
          flutter analyze

      - name: Flutter tests
        run: |
          cd sakina-frontend
          flutter test --reporter compact

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: |
          cd sakina-backend
          cargo fmt -- --check

      - name: Run clippy
        run: |
          cd sakina-backend
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run backend tests
        run: |
          cd sakina-backend
          cargo test --locked --all-targets --all-features

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sakina-only guard
        run: bash scripts/ensure-sakina-only.sh

      - name: Secret scan
        run: bash scripts/sakina/verify-no-secret-leak.sh --all-files

  android-build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"

      - name: Install Flutter dependencies
        run: |
          cd sakina-frontend
          flutter pub get

      - name: Build Android APK check
        run: |
          cd sakina-frontend
          flutter build apk --debug --dart-define=SAKINA_API_BASE_URL=https://api.7jzi.com/v1

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sakina-android-check-artifacts
          path: |
            sakina-frontend/build/app/outputs/flutter-apk/*.apk
            sakina-frontend/build/app/outputs/bundle/**/*.aab
          if-no-files-found: ignore

  ios-build-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"

      - name: Verify iOS target exists
        run: |
          if [[ ! -d sakina-frontend/ios ]]; then
            echo "sakina-frontend/ios is missing. Restore the iOS target before running this job."
            exit 1
          fi

      - name: Install Flutter dependencies
        run: |
          cd sakina-frontend
          flutter pub get

      - name: Build iOS without code signing
        run: |
          cd sakina-frontend
          flutter build ios --no-codesign --dart-define=SAKINA_API_BASE_URL=https://api.7jzi.com/v1

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sakina-ios-check-artifacts
          path: |
            sakina-frontend/build/ios/**
          if-no-files-found: ignore
