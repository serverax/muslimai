name: Post Deploy Smoke Tests

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Frontend base URL (e.g. https://7jzi.com)"
        required: true
        type: string
      backend_url:
        description: "Backend base URL (e.g. https://api.7jzi.com)"
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend landing smoke test
        run: |
          curl -fsS "${{ inputs.frontend_url }}/lander" > /dev/null

      - name: Backend health and readiness smoke tests
        run: |
          curl -fsS "${{ inputs.backend_url }}/health" > /dev/null
          curl -fsS "${{ inputs.backend_url }}/ready" > /dev/null
          curl -fsS "${{ inputs.backend_url }}/metrics" > /dev/null

      - name: Backend waitlist smoke test
        run: |
          email="smoke-${GITHUB_RUN_ID}@example.com"
          curl -fsS -X POST "${{ inputs.backend_url }}/waitlist" \
            -H "content-type: application/json" \
            -d "{\"name\":\"Smoke Test\",\"email\":\"${email}\",\"source\":\"ci-smoke\"}" > /dev/null
