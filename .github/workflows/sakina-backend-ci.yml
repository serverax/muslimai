name: sakina-backend-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "sakina-backend/**"
      - ".github/workflows/sakina-backend-ci.yml"
  pull_request:
    paths:
      - "sakina-backend/**"
      - ".github/workflows/sakina-backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://sakina_user:sakina_password@localhost:5432/sakina_test
      SAKINA_REDIS_URL: redis://localhost:6379
      RUST_TEST_THREADS: 1
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sakina_test
          POSTGRES_USER: sakina_user
          POSTGRES_PASSWORD: sakina_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: |
          cd sakina-backend
          cargo fmt -- --check

      - name: Run clippy
        run: |
          cd sakina-backend
          cargo clippy -- -D warnings

      - name: Run backend tests
        run: |
          cd sakina-backend
          cargo test --locked --all-targets --all-features -- --test-threads=1

      - name: Build backend image
        run: |
          docker build -f sakina-backend/Dockerfile -t sakina-backend-ci:${{ github.sha }} .
