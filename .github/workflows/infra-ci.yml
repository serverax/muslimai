name: Infrastructure CI

on:
  push:
    paths:
      - 'sakina-infra/**'
      - 'sakina-tests/**'
      - '.github/workflows/infra-ci.yml'
  pull_request:
    paths:
      - 'sakina-infra/**'
      - 'sakina-tests/**'
      - '.github/workflows/infra-ci.yml'
  workflow_dispatch:

jobs:
  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifest YAML syntax
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          manifest_root = Path("sakina-infra/manifests")
          files = sorted(manifest_root.rglob("*.yaml"))
          assert files, "no Kubernetes manifests found"
          for path in files:
              docs = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              assert docs, f"{path} contains no YAML documents"
          print(f"Validated YAML syntax for {len(files)} manifest files.")
          PY

      - name: Verify deployment readiness contract
        run: |
          python - <<'PY'
          from pathlib import Path
          backend_manifest = Path("sakina-infra/manifests/sakina-prod/sakina-backend.yaml").read_text()
          frontend_manifest = Path("sakina-infra/manifests/sakina-prod/sakina-frontend.yaml").read_text()
          assert "path: /v1/ready" in backend_manifest, "readiness probe must target /v1/ready"
          assert "ghcr.io/serverax/sakina-backend:" in backend_manifest, "backend image must use pinned GHCR tag"
          assert "SUPABASE_SERVICE_ROLE_KEY" in backend_manifest, "backend secret contract missing"
          assert "ghcr.io/serverax/sakina-frontend:" in frontend_manifest, "frontend image must use pinned GHCR tag"
          PY

      - name: Validate Docker Compose config
        run: docker compose -f sakina-infra/docker-compose.yml config

      - name: Validate integration test collection
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests
          pytest --collect-only -q sakina-tests/integration/test_rag_query.py
