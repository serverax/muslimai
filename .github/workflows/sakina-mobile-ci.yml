name: sakina-mobile-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "sakina-frontend/**"
      - ".github/workflows/sakina-mobile-ci.yml"
  pull_request:
    paths:
      - "sakina-frontend/**"
      - ".github/workflows/sakina-mobile-ci.yml"

permissions:
  contents: read

jobs:
  mobile-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"

      - name: Install dependencies
        run: |
          cd sakina-frontend
          flutter pub get

      - name: Analyze
        run: |
          cd sakina-frontend
          flutter analyze

      - name: Test
        run: |
          cd sakina-frontend
          flutter test --reporter compact
