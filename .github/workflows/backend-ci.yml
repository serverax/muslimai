name: Backend CI

on:
  push:
    paths:
      - 'sakina-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'sakina-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://sakina_user:sakina_password@localhost:5432/sakina_test
      SAKINA_REDIS_URL: redis://localhost:6379
      RUST_TEST_THREADS: 1
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sakina_test
          POSTGRES_USER: sakina_user
          POSTGRES_PASSWORD: sakina_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          cd sakina-backend
          cargo test --verbose -- --test-threads=1

      - name: Assert module contract schema surface
        run: |
          grep -RInE "struct (QuranOverview|PrayerOverview|KnowledgeOverview|CommunityOverview)" sakina-backend/src/models/mod.rs
          grep -RInE "struct (RagStatusResponse|RagSourcesResponse|RagSearchResponse|DecisionResponse)" sakina-backend/src/models/mod.rs
          grep -RInE "source_type: String|source_name: String|source_reference: String|review_status: String" sakina-backend/src/models/mod.rs
          grep -RInE "ModuleSafetyStatus|ReviewStatus" sakina-backend/src/models/mod.rs
          grep -RInE "/quran/overview|/prayer/overview|/knowledge/overview|/community/overview" sakina-backend/src/main.rs
          grep -RInE "/status|/sources|/search|/decide" sakina-backend/src/main.rs
          grep -RInE "invalid_provenance|feature_disabled|subscription_required" sakina-backend/src/handlers/modules.rs sakina-backend/src/handlers/rag.rs
          grep -RInE "openapi: 3.0.3" sakina-docs/MODULE_CONTRACTS_OPENAPI_2026-05-28.yaml

      - name: Check formatting
        run: |
          cd sakina-backend
          cargo fmt -- --check

      - name: Run clippy
        run: |
          cd sakina-backend
          cargo clippy -- -D warnings

      - name: Run dependency vulnerability scan
        run: |
          cargo install cargo-audit --locked
          cd sakina-backend
          cargo tree -i sqlx-mysql -e features | tee ../reports-sqlx-mysql-feature-tree.txt
          cargo tree -i rsa -e features | tee ../reports-rsa-feature-tree.txt
          cargo audit --ignore RUSTSEC-2023-0071

      - name: Build Docker image
        run: |
          docker build -f sakina-backend/Dockerfile.api -t sakina-backend-api:${{ github.sha }} .
