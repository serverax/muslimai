name: Sakina Images

on:
  workflow_dispatch:
  push:
    branches:
      - qa-security-hardening
      - main
      - master
    paths:
      - "sakina-backend/**"
      - "sakina-frontend/**"
      - "Dockerfile*"
      - ".github/workflows/sakina-images.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: serverax

jobs:
  backend-image:
    name: Build and push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sakina-backend/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sakina-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/sakina-backend:qa-security-hardening

  frontend-image:
    name: Build and push frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend Dockerfile exists
        run: test -f Dockerfile.frontend

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sakina-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/sakina-frontend:qa-security-hardening
