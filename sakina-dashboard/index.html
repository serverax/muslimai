<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakina — Moderation Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>SAKINA</h1>
        <span class="tagline">Moderation Dashboard — Trustworthy. Private. Islamic.</span>
      </header>

      <main>
        <section class="card">
          <div class="card-head">
            <h2>Guardrail Triggers</h2>
            <button @click="refresh" :disabled="loading">
              {{ loading ? 'Loading…' : 'Refresh' }}
            </button>
          </div>

          <p v-if="error" class="error">{{ error }}</p>

          <table v-if="guardrails.length">
            <thead>
              <tr><th>Timestamp</th><th>Query</th><th>Reason</th><th>User</th></tr>
            </thead>
            <tbody>
              <tr v-for="(g, i) in guardrails" :key="i">
                <td>{{ g.timestamp }}</td>
                <td class="query">{{ g.query }}</td>
                <td><span class="badge">{{ g.trigger_reason }}</span></td>
                <td>{{ g.user_id || 'anonymous' }}</td>
              </tr>
            </tbody>
          </table>

          <p v-else-if="!loading && !error" class="muted">
            No guardrail triggers recorded.
          </p>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
