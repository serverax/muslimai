server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"sakinaai-admin-web"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
