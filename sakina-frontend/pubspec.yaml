name: sakina_frontend
description: "Project Sakina - Islamic AI Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2-dev.2
  riverpod_annotation: ^4.0.3-dev.2

  # Local storage
  sqflite: ^2.3.0
  sqflite_sqlcipher: any
  path: ^1.8.3

  # Encryption
  encrypt: ^5.0.0
  cryptography: any

  # Networking
  http: ^1.1.0

  # Internationalization
  intl: ^0.20.2

  # UI/Material
  flutter_localizations:
    sdk: flutter

  # JSON serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.4-dev.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
  # NOTE: custom fonts (Amiri/Inter) declarations removed until real .ttf files
  # exist; the theme's fontFamily strings fall back to system fonts for now.
