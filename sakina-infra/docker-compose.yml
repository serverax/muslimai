services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sakina
      POSTGRES_USER: sakina_user
      POSTGRES_PASSWORD: sakina_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sakina-backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  vllm:
    image: sakina-backend-vllm:latest
    build:
      context: ../sakina-backend
      dockerfile: Dockerfile.vllm
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0

  api:
    image: sakina-backend-api:latest
    build:
      context: ../sakina-backend
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://sakina_user:sakina_password@postgres:5432/sakina
      SAKINA_API_TOKEN: local-dev-token
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: verified_knowledge
      VLLM_URL: http://vllm:8000
      VLLM_CHAT_MODEL: sakina-local
      VLLM_EMBEDDING_MODEL: sakina-local-embedding
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LOG_LEVEL: info
      BRAND_NAME: SAKINA
      BRAND_TAGLINE: "Trustworthy. Private. Islamic."
      BRAND_COLOR_PRIMARY: "#1B6B5E"
      LOG_PREFIX: "[SAKINA]"
    depends_on:
      - postgres
      - qdrant
      - vllm

volumes:
  postgres-data:
  qdrant-data:
