version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sakina
      POSTGRES_USER: sakina_user
      POSTGRES_PASSWORD: sakina_password
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakina_user -d sakina"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "26333:6333"

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "21434:11434"

  llm-gateway:
    build:
      context: ..
      dockerfile: sakina-backend/Dockerfile
    command: ["/usr/local/bin/sakina-llm-gateway"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SAKINA_LLM_MODEL: qwen2.5:0.5b
      SAKINA_LLM_GATEWAY_BIND: 0.0.0.0:8080
    depends_on:
      - ollama

  rules-engine:
    build:
      context: ..
      dockerfile: sakina-backend/Dockerfile
    environment:
      DATABASE_URL: postgres://sakina_user:sakina_password@postgres:5432/sakina
      SAKINA_REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      SERVICE_NAME: "sakina-rules-engine"
      VLLM_URL: http://ollama:11434
      SAKINA_LLM_GATEWAY_URL: http://llm-gateway:8080
      VLLM_EMBEDDING_MODEL: bge-m3
      JWT_SECRET: sakina_production_jwt_secret_32_chars_long
      ENCRYPTION_KEY: sakina_production_encryption_key_32_ch
    depends_on:
      postgres:
        condition: service_healthy

  citation-guard:
    build:
      context: ..
      dockerfile: sakina-backend/Dockerfile
    environment:
      DATABASE_URL: postgres://sakina_user:sakina_password@postgres:5432/sakina
      SAKINA_REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      SERVICE_NAME: "sakina-citation-guard"
      VLLM_URL: http://ollama:11434
      SAKINA_LLM_GATEWAY_URL: http://llm-gateway:8080
      VLLM_EMBEDDING_MODEL: bge-m3
      JWT_SECRET: sakina_production_jwt_secret_32_chars_long
      ENCRYPTION_KEY: sakina_production_encryption_key_32_ch
    depends_on:
      postgres:
        condition: service_healthy

  rag-service:
    build:
      context: ..
      dockerfile: sakina-backend/Dockerfile
    environment:
      DATABASE_URL: postgres://sakina_user:sakina_password@postgres:5432/sakina
      SAKINA_REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      SERVICE_NAME: "sakina-rag-service"
      VLLM_URL: http://ollama:11434
      SAKINA_LLM_GATEWAY_URL: http://llm-gateway:8080
      VLLM_EMBEDDING_MODEL: bge-m3
      JWT_SECRET: sakina_production_jwt_secret_32_chars_long
      ENCRYPTION_KEY: sakina_production_encryption_key_32_ch
      LLM_PROVIDER_URL: http://llm-gateway:8080
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  brain:
    build:
      context: ..
      dockerfile: sakina-backend/Dockerfile
    environment:
      DATABASE_URL: postgres://sakina_user:sakina_password@postgres:5432/sakina
      SAKINA_REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      SAKINA_RULES_ENGINE_URL: http://rules-engine:8080
      SAKINA_RAG_URL: http://rag-service:8080
      SAKINA_CITATION_GUARD_URL: http://citation-guard:8080
      SAKINA_LLM_ENABLED: "true"
      SERVICE_NAME: "sakina-brain"
      VLLM_URL: http://ollama:11434
      SAKINA_LLM_GATEWAY_URL: http://llm-gateway:8080
      VLLM_EMBEDDING_MODEL: bge-m3
      JWT_SECRET: sakina_production_jwt_secret_32_chars_long
      ENCRYPTION_KEY: sakina_production_encryption_key_32_ch
    depends_on:
      - rules-engine
      - rag-service
      - llm-gateway
      - citation-guard

  api-gateway:
    build:
      context: ..
      dockerfile: sakina-backend/Dockerfile
    ports:
      - "28080:8080"
    environment:
      DATABASE_URL: postgres://sakina_user:sakina_password@postgres:5432/sakina
      SAKINA_REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      SAKINA_BRAIN_URL: http://brain:8080
      SAKINA_RULES_ENGINE_URL: http://rules-engine:8080
      VLLM_URL: http://ollama:11434
      SAKINA_LLM_GATEWAY_URL: http://llm-gateway:8080
      VLLM_EMBEDDING_MODEL: bge-m3
      JWT_SECRET: sakina_production_jwt_secret_32_chars_long
      ENCRYPTION_KEY: sakina_production_encryption_key_32_ch
    depends_on:
      - brain
