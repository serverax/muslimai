version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sakina
      POSTGRES_USER: sakina_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sakina-backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

  llm-gateway:
    image: sakina-backend:latest
    command: ["sakina-llm-gateway"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SAKINA_LLM_MODEL: qwen2.5:0.5b
      SAKINA_LLM_GATEWAY_BIND: 0.0.0.0:8087
    depends_on:
      - ollama

  api:
    image: sakina-backend:latest
    ports:
      - "28080:8080"
    environment:
      DATABASE_URL: postgres://sakina_user:${POSTGRES_PASSWORD}@postgres:5432/sakina
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      QDRANT_URL: http://qdrant:6333
      SAKINA_REDIS_URL: redis://redis:6379
      SAKINA_ENV: local
      SAKINA_LLM_ENABLED: "true"
      SAKINA_LLM_GATEWAY_URL: http://llm-gateway:8087
      # Feature flags on so entitlement gating (SAK-012) is exercised, not flag-blocked.
      SAKINA_FEATURE_QURAN: "true"
      SAKINA_FEATURE_PRAYER: "true"
      SAKINA_FEATURE_KNOWLEDGE: "true"
      SAKINA_FEATURE_COMMUNITY: "true"
      # Monolithic mode for local QA (all internal calls local)
      ALLOW_DEMO_MODE: "false"
      ALLOW_MOCK_AI: "false"
      ALLOW_MOCK_RAG: "false"
      LOG_LEVEL: info
    depends_on:
      - postgres
      - qdrant
      - redis
      - llm-gateway

volumes:
  postgres-data:
  qdrant-data:
