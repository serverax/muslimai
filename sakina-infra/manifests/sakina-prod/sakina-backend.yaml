apiVersion: v1
kind: Service
metadata:
  name: sakina-backend
  namespace: sakina-prod
  labels:
    app: sakina-backend
spec:
  type: ClusterIP
  selector:
    app: sakina-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakina-backend
  namespace: sakina-prod
  labels:
    app: sakina-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakina-backend
  template:
    metadata:
      labels:
        app: sakina-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/serverax/sakina-backend:cd02005
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SAKINA_FEATURE_QURAN
              value: "false"
            - name: SAKINA_FEATURE_PRAYER
              value: "false"
            - name: SAKINA_FEATURE_COMMUNITY
              value: "false"
            - name: SAKINA_FEATURE_KNOWLEDGE
              value: "false"
            - name: SAKINA_RAG_QURAN_ENABLED
              value: "false"
            - name: SAKINA_RAG_PRAYER_ENABLED
              value: "false"
            - name: SAKINA_RAG_COMMUNITY_ENABLED
              value: "false"
            - name: SAKINA_RAG_KNOWLEDGE_ENABLED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sakina-supabase-secret
                  key: DATABASE_URL
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sakina-supabase-secret
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: sakina-supabase-secret
                  key: SUPABASE_SERVICE_ROLE_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
