apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: sakina-data
data:
  POSTGRES_DB: sakina
  POSTGRES_USER: sakina_user
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sakina-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-auth
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U sakina_user
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        # Use cloud-managed CSI storage in production clusters.
        # For kind/local dev, override this with local-storage if needed.
        storageClassName: managed-csi
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sakina-data
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres

# Required pre-created secret in namespace `sakina-data`:
# - postgres-auth (keys: POSTGRES_PASSWORD)
