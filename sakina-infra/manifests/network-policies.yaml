# Network Policies - Project Sakina
# Default-deny + explicit allow rules for zero-trust networking

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sakina-api
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: sakina-api
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
# Allow API to receive traffic from Traefik (when deployed)
# and allow internal service-to-service communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: sakina-api
spec:
  podSelector:
    matchLabels:
      app: sakina-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Traefik (when deployed)
    - podSelector:
        matchLabels:
          app: traefik
    # Prometheus scraping /metrics from the monitoring namespace
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sakina-monitoring
    ports:
    - protocol: TCP
      port: 8080
---
# Allow API to egress to PostgreSQL and Qdrant
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: sakina-api
spec:
  podSelector:
    matchLabels:
      app: sakina-api
  policyTypes:
  - Egress
  egress:
  # Allow DNS for service discovery
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow to PostgreSQL in sakina-data namespace
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sakina-data
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow to Qdrant in sakina-data namespace
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sakina-data
      podSelector:
        matchLabels:
          app: qdrant
    ports:
    - protocol: TCP
      port: 6333
---
# sakina-data namespace: default-deny all
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sakina-data
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: sakina-data
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
# Allow PostgreSQL to receive connections from sakina-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: sakina-data
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sakina-api
      podSelector:
        matchLabels:
          app: sakina-api
    ports:
    - protocol: TCP
      port: 5432
---
# Allow Qdrant to receive connections from sakina-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qdrant-ingress
  namespace: sakina-data
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sakina-api
      podSelector:
        matchLabels:
          app: sakina-api
    ports:
    - protocol: TCP
      port: 6333
---
# Allow DNS egress for both
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: sakina-data
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
---
# sakina-core namespace: default-deny all (for vLLM when deployed)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sakina-core
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: sakina-core
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
# sakina-audit namespace: default-deny all
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sakina-audit
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: sakina-audit
spec:
  podSelector: {}
  policyTypes:
  - Egress
