apiVersion: v1
kind: ConfigMap
metadata:
  name: sakina-admin-code
  namespace: sakina-mobile-staging
data:
  index.html: |
    <!doctype html>
    <html>
    <head><meta charset="utf-8"><title>Sakina Admin</title></head>
    <body>
      <h1>Sakina Admin Staging</h1>
      <p>Namespace: sakina-mobile-staging</p>
      <p>Status: healthy</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakina-admin
  namespace: sakina-mobile-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakina-admin
  template:
    metadata:
      labels:
        app: sakina-admin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: admin
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: admin-code
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: admin-code
          configMap:
            name: sakina-admin-code
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sakina-admin
  namespace: sakina-mobile-staging
spec:
  selector:
    app: sakina-admin
  ports:
    - name: http
      port: 80
      targetPort: 80
