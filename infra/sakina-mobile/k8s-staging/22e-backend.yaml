apiVersion: v1
kind: ConfigMap
metadata:
  name: sakina-backend-code
  namespace: sakina-mobile-staging
data:
  server.py: |
    import json
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
      def _send(self, code, payload):
        body = json.dumps(payload).encode("utf-8")
        self.send_response(code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

      def do_GET(self):
        if self.path == "/health":
          self._send(200, {"status": "ok", "service": "sakina-backend", "release": "22e-staging"})
          return
        if self.path == "/api/v1/modules":
          self._send(200, {"modules": [{"id": "patience", "title": "Patience in Islam"}, {"id": "prayer", "title": "Daily Prayer"}]})
          return
        self._send(404, {"error": "not_found"})

      def do_POST(self):
        if self.path != "/api/v1/chat":
          self._send(404, {"error": "not_found"})
          return
        length = int(self.headers.get("Content-Length", "0"))
        body = self.rfile.read(length) if length > 0 else b"{}"
        payload = json.loads(body.decode("utf-8") or "{}")
        query = payload.get("message") or ""

        req = urllib.request.Request(
          "http://sakina-rag-retrieval:8081/retrieve",
          data=json.dumps({"query": query}).encode("utf-8"),
          headers={"Content-Type": "application/json"},
          method="POST",
        )
        with urllib.request.urlopen(req, timeout=5) as resp:
          rag_payload = json.loads(resp.read().decode("utf-8"))

        self._send(200, {
          "answer": rag_payload.get("answer", ""),
          "citations": rag_payload.get("citations", []),
          "citation_verification": rag_payload.get("citation_verification", "unknown")
        })

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakina-backend
  namespace: sakina-mobile-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakina-backend
  template:
    metadata:
      labels:
        app: sakina-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: python:3.11-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: sakina-backend-code
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sakina-backend
  namespace: sakina-mobile-staging
spec:
  selector:
    app: sakina-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
