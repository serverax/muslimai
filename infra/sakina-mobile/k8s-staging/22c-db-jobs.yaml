apiVersion: batch/v1
kind: Job
metadata:
  name: sakina-db-migrate
  namespace: sakina-mobile-staging
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: migrate
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakina-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sakina-postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sakina-postgres-secret
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                pg_isready -h sakina-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break
                sleep 2
              done
              for f in /migrations/*.sql; do
                echo "Applying $(basename "$f")"
                psql -h sakina-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$f"
              done
              echo "Migrations complete"
          volumeMounts:
            - name: migration-files
              mountPath: /migrations
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: postgres-run
              mountPath: /var/run/postgresql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: migration-files
          configMap:
            name: sakina-db-migrations
        - name: tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sakina-db-verify
  namespace: sakina-mobile-staging
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: verify
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakina-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sakina-postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sakina-postgres-secret
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                pg_isready -h sakina-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break
                sleep 2
              done
              required="users user_profiles modules user_module_progress chat_threads chat_messages rag_documents rag_chunks rag_embeddings notifications admin_audit_events"
              existing=$(psql -h sakina-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select tablename from pg_tables where schemaname='public';")
              missing=""
              for t in $required; do
                echo "$existing" | grep -qx "$t" || missing="$missing $t"
              done
              echo "Required tables: $required"
              if [ -n "$missing" ]; then
                echo "Missing tables:$missing"
                exit 1
              fi
              echo "Missing tables: none"
              echo "Schema verification completed successfully"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-run
              mountPath: /var/run/postgresql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
