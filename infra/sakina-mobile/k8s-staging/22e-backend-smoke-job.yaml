apiVersion: batch/v1
kind: Job
metadata:
  name: sakina-backend-smoke
  namespace: sakina-mobile-staging
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: smoke
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - |
              set -eu
              curl -fsS http://sakina-backend:8080/health >/tmp/health.json
              grep -q '"status": "ok"' /tmp/health.json

              curl -fsS http://sakina-backend:8080/api/v1/modules >/tmp/modules.json
              grep -q '"modules"' /tmp/modules.json

              curl -fsS -X POST http://sakina-backend:8080/api/v1/chat -H 'Content-Type: application/json' -d '{"message":"What is patience in Islam?"}' >/tmp/chat.json
              grep -q '"citations"' /tmp/chat.json
              grep -q '"citation_verification": "passed"' /tmp/chat.json

              echo "Backend smoke tests completed successfully"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
