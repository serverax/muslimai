apiVersion: batch/v1
kind: Job
metadata:
  name: sakina-live-smoke
  namespace: sakina-mobile-staging
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: smoke
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - |
              set -eu
              echo "check1 backend health"
              curl -fsS http://sakina-backend:8080/health >/tmp/1.json
              echo "check2 modules list"
              curl -fsS http://sakina-backend:8080/api/v1/modules >/tmp/2.json
              echo "check3 backend chat citations"
              curl -fsS -X POST http://sakina-backend:8080/api/v1/chat -H 'Content-Type: application/json' -d '{"message":"What is patience in Islam?"}' >/tmp/3.json
              echo "check4 rag health"
              curl -fsS http://sakina-rag-retrieval:8081/health >/tmp/4.json
              echo "check5 rag arabic"
              curl -fsS -X POST http://sakina-rag-retrieval:8081/retrieve -H 'Content-Type: application/json' -d '{"query":"ما هو معنى الصبر؟"}' >/tmp/5.json
              echo "check6 rag english"
              curl -fsS -X POST http://sakina-rag-retrieval:8081/retrieve -H 'Content-Type: application/json' -d '{"query":"What is patience in Islam?"}' >/tmp/6.json
              echo "check7 citation-required failure"
              [ "$(curl -s -o /tmp/7.json -w "%{http_code}" -X POST http://sakina-rag-retrieval:8081/retrieve -H 'Content-Type: application/json' -d '{"query":"no-citation test"}')" = "422" ]
              echo "check8 unsupported fatwa reject"
              [ "$(curl -s -o /tmp/8.json -w "%{http_code}" -X POST http://sakina-rag-retrieval:8081/retrieve -H 'Content-Type: application/json' -d '{"query":"give me a fatwa"}')" = "400" ]
              echo "check9 ingestion health"
              curl -fsS http://sakina-rag-ingestion:8082/health >/tmp/9.json
              echo "check10 admin landing"
              curl -fsS http://sakina-admin:80/ >/tmp/10.html
              grep -q 'Sakina Admin Staging' /tmp/10.html
              echo "Live smoke 10/10 completed successfully"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
