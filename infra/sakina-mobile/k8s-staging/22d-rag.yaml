apiVersion: v1
kind: ConfigMap
metadata:
  name: sakina-islamic-source-registry
  namespace: sakina-mobile-staging
data:
  sources.json: |
    {
      "sources": [
        {"id": "quran-enc", "type": "quran", "lang": ["ar", "en"], "freshness_days": 7},
        {"id": "sahih-bukhari", "type": "hadith", "lang": ["ar", "en"], "freshness_days": 14},
        {"id": "fiqh-guidance", "type": "scholarly", "lang": ["en"], "freshness_days": 21}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sakina-rag-retrieval-code
  namespace: sakina-mobile-staging
data:
  server.py: |
    import json
    import re
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
      def _send(self, code, payload):
        body = json.dumps(payload).encode("utf-8")
        self.send_response(code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

      def do_GET(self):
        if self.path == "/health":
          self._send(200, {"status": "ok", "service": "retrieval", "embedding_route": "local-placeholder"})
          return
        self._send(404, {"error": "not_found"})

      def do_POST(self):
        if self.path != "/retrieve":
          self._send(404, {"error": "not_found"})
          return
        length = int(self.headers.get("Content-Length", "0"))
        body = self.rfile.read(length) if length > 0 else b"{}"
        payload = json.loads(body.decode("utf-8") or "{}")
        query = (payload.get("query") or "").strip()

        if "fatwa" in query.lower():
          self._send(400, {"status": "rejected", "reason": "unsupported_fatwa_request"})
          return
        if "no-citation" in query.lower() or "no citation" in query.lower():
          self._send(422, {"status": "rejected", "reason": "citation_required"})
          return

        is_arabic = bool(re.search(r"[\u0600-\u06FF]", query))
        answer = "وعليكم السلام. هذا جواب تجريبي مع دليل موثق." if is_arabic else "Peace be upon you. This is a staged answer with verified citation."
        self._send(200, {
          "status": "ok",
          "answer": answer,
          "citation_verification": "passed",
          "embedding_route": "local-placeholder",
          "citations": [
            {"source_id": "quran-enc", "reference": "2:186", "freshness_days": 7}
          ]
        })

    HTTPServer(("0.0.0.0", 8081), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakina-rag-retrieval
  namespace: sakina-mobile-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakina-rag-retrieval
  template:
    metadata:
      labels:
        app: sakina-rag-retrieval
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: retrieval
          image: python:3.11-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: sakina-rag-retrieval-code
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sakina-rag-retrieval
  namespace: sakina-mobile-staging
spec:
  selector:
    app: sakina-rag-retrieval
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sakina-rag-ingestion-code
  namespace: sakina-mobile-staging
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
      def _send(self, code, payload):
        body = json.dumps(payload).encode("utf-8")
        self.send_response(code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

      def do_GET(self):
        if self.path == "/health":
          self._send(200, {"status": "ok", "service": "ingestion"})
          return
        self._send(404, {"error": "not_found"})

      def do_POST(self):
        if self.path != "/ingest":
          self._send(404, {"error": "not_found"})
          return
        self._send(200, {"status": "queued", "source_registry": "sakina-islamic-source-registry"})

    HTTPServer(("0.0.0.0", 8082), Handler).serve_forever()
---
