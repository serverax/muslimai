apiVersion: v1
kind: Service
metadata:
  name: sakina-postgres
  namespace: sakina-mobile-prod
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: production
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: sakina-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sakina-postgres
  namespace: sakina-mobile-prod
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: production
spec:
  serviceName: sakina-postgres
  replicas: 1
  selector:
    matchLabels:
      app: sakina-postgres
  template:
    metadata:
      labels:
        app: sakina-postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: sakina-mobile
        app.kubernetes.io/environment: production
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: sakina_mobile
            - name: POSTGRES_USER
              value: sakina
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakina-prod-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: postgres-run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/part-of: sakina-mobile
          app.kubernetes.io/environment: production
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
