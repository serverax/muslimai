apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sakina-default-deny-ingress
  namespace: sakina-mobile-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: sakina-mobile-prod
spec:
  podSelector:
    matchLabels:
      app: sakina-backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-internal-services
  namespace: sakina-mobile-prod
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - sakina-brain
          - sakina-rules-engine
          - sakina-citation-guard
          - sakina-document-service
          - sakina-rag-retrieval
          - sakina-llm-gateway
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sakina-backend
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-brain-to-internal-services
  namespace: sakina-mobile-prod
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - sakina-rules-engine
          - sakina-citation-guard
          - sakina-rag-retrieval
          - sakina-llm-gateway
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sakina-brain
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-to-persistence
  namespace: sakina-mobile-prod
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - sakina-postgres
          - sakina-qdrant
          - sakina-redis
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - sakina-backend
                  - sakina-brain
                  - sakina-rag-retrieval
                  - sakina-rag-ingestion
                  - sakina-worker
                  - sakina-rules-engine
                  - sakina-citation-guard
                  - sakina-document-service
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-llm-gateway-to-ollama
  namespace: sakina-mobile-prod
spec:
  podSelector:
    matchLabels:
      app: ollama-inference
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sakina-llm-gateway
  policyTypes:
    - Ingress
