apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sakina-ollama-models
  namespace: sakina-mobile-prod
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sakina-ollama
  namespace: sakina-mobile-prod
spec:
  selector:
    app: sakina-ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakina-ollama
  namespace: sakina-mobile-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sakina-ollama
  template:
    metadata:
      labels:
        app: sakina-ollama
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: sakina-ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-inference
  namespace: sakina-mobile-prod
spec:
  selector:
    app: ollama-inference
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama-inference
  namespace: sakina-mobile-prod
spec:
  selector:
    matchLabels:
      app: ollama-inference
  template:
    metadata:
      labels:
        app: ollama-inference
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
