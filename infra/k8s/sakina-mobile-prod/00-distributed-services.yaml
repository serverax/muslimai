metadata:
  name: sakina-aia-orchestrator-service
  namespace: sakina-mobile-staging
  labels:
    app: sakina-aia-orchestrator-service
    part-of: sakina
    architecture: distributed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakina-aia-orchestrator-service
  template:
    metadata:
      labels:
        app: sakina-aia-orchestrator-service
        part-of: sakina
        architecture: distributed
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sakina-aia-orchestrator-service
          image: ghcr.io/serverax/sakina-backend:f06535870dfcbec20b5c9757b6525a98edbc9157
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.sakina_aia_orchestrator_service.main"]
          args: []
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "sakina-aia-orchestrator-service"
            - name: SERVICE_PORT
              value: "8080"
            - name: SERVICE_KIND
              value: "internal"
            - name: REQUIRE_REAL_WIRING
              value: "true"
            - name: REAL_SERVICE_WIRED
              value: "false"
            - name: OLLAMA_BASE_URL
              value: "http://ollama-inference.sakina-mobile-staging.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: "qwen2.5:3b"
            - name: AUTH_SERVICE_URL
              value: "http://sakina-auth-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: WORKSPACE_SERVICE_URL
              value: "http://sakina-user-workspace-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: ASK_SHAIKH_SERVICE_URL
              value: "http://sakina-ask-shaikh-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: MOTHER_ALGORITHM_SERVICE_URL
              value: "http://sakina-mother-algorithm-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: AIA_ORCHESTRATOR_SERVICE_URL
              value: "http://sakina-aia-orchestrator-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: ISLAMIC_KNOWLEDGE_SERVICE_URL
              value: "http://sakina-islamic-knowledge-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: RAG_RETRIEVAL_SERVICE_URL
              value: "http://sakina-rag-retrieval-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: RAG_INGESTION_SERVICE_URL
              value: "http://sakina-rag-ingestion-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: PSYCHOLOGY_SUPPORT_SERVICE_URL
              value: "http://sakina-psychology-support-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: SAFETY_POLICY_SERVICE_URL
              value: "http://sakina-safety-policy-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: CITATION_GUARD_SERVICE_URL
              value: "http://sakina-citation-guard-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: DOCUMENT_SERVICE_URL
              value: "http://sakina-document-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: AUDIT_SERVICE_URL
              value: "http://sakina-audit-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://sakina-notification-service.sakina-mobile-staging.svc.cluster.local:8080"
            - name: LLM_GATEWAY_URL
              value: "http://sakina-llm-gateway.sakina-mobile-staging.svc.cluster.local:8087"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
