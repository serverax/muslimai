apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sakina-mobile-prod

commonLabels:
  app.kubernetes.io/part-of: sakina-mobile
  app.kubernetes.io/environment: production

resources:
  - namespace.yaml
  - postgres.yaml
  - qdrant.yaml
  - redis.yaml
  - ollama.yaml
  - ollama-preload.yaml
  - llm-gateway.yaml
  - db-migrations.yaml
  - rag.yaml
  - brain.yaml
  - rules-engine.yaml
  - citation-guard.yaml
  - document-service.yaml
  - worker.yaml
  - backend.yaml
  - admin.yaml
  - ingress.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
