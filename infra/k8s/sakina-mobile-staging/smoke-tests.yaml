apiVersion: batch/v1
kind: Job
metadata:
  name: sakina-staging-smoke
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: smoke-tests
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-tests
        app.kubernetes.io/part-of: sakina-mobile
        app.kubernetes.io/environment: staging
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: curlimages/curl:8.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              curl -fsS http://sakina-backend:8080/health >/dev/null
              curl -fsS http://sakina-rag:8080/ >/dev/null
              curl -fsS http://sakina-admin:80/ >/dev/null
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
