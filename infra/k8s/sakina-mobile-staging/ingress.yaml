apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sakina-api
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: api-ingress
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: api.7jzi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sakina-backend
                port:
                  number: 8080
