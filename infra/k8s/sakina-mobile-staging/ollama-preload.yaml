apiVersion: batch/v1
kind: Job
metadata:
  name: sakina-ollama-preload
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: ollama-preload
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-preload
        app.kubernetes.io/part-of: sakina-mobile
        app.kubernetes.io/environment: staging
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preload
          image: curlimages/curl:8.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              model="tinyllama"
              attempts=0
              until curl -fsS http://sakina-ollama:11434/api/tags >/tmp/ollama-tags.json; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo "sakina-ollama did not become reachable for model preload"
                  exit 1
                fi
                sleep 5
              done
              curl -fsS http://sakina-ollama:11434/api/pull \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"${model}\",\"stream\":false}"
              curl -fsS http://sakina-ollama:11434/api/tags | grep -i "${model}"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
