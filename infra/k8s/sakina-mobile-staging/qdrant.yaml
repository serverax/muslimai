apiVersion: v1
kind: Service
metadata:
  name: sakina-qdrant
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  ports:
    - name: http
      port: 6333
      targetPort: 6333
  selector:
    app.kubernetes.io/name: qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sakina-qdrant
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  serviceName: sakina-qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: sakina-mobile
        app.kubernetes.io/environment: staging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.10.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
              name: http
          env:
            - name: QDRANT__STORAGE__STORAGE_PATH
              value: /qdrant/storage
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
        labels:
          app.kubernetes.io/part-of: sakina-mobile
          app.kubernetes.io/environment: staging
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
