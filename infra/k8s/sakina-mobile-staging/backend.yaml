apiVersion: v1
kind: Service
metadata:
  name: sakina-backend
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakina-backend
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: sakina-mobile
        app.kubernetes.io/environment: staging
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/sakina-mobile-backend:staging-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sakina-staging-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sakina-staging-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sakina-staging-secrets
                  key: openai-api-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
