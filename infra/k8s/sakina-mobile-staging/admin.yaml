apiVersion: v1
kind: Service
metadata:
  name: sakina-admin
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakina-admin
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: sakina-mobile
        app.kubernetes.io/environment: staging
    spec:
      containers:
        - name: admin
          image: ghcr.io/example/sakina-mobile-admin:staging-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
