apiVersion: batch/v1
kind: Job
metadata:
  name: sakina-db-migrations
  namespace: sakina-mobile-staging
  labels:
    app.kubernetes.io/name: db-migrations
    app.kubernetes.io/part-of: sakina-mobile
    app.kubernetes.io/environment: staging
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrations
        app.kubernetes.io/part-of: sakina-mobile
        app.kubernetes.io/environment: staging
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrations
          image: ghcr.io/example/sakina-mobile-backend:staging-latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - >
              echo "Running Sakina DB migrations";
              /usr/local/bin/sakina-api --help >/dev/null
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sakina-staging-secrets
                  key: database-url
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
