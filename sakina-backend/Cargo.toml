[package]
name = "sakina-backend"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-multipart = "0.7"
actix-rt = "2.9"
actix-cors = "0.7"
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.0"
opentelemetry-stdout = "0.32.0"
tracing-opentelemetry = "0.33.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
redis = { version = "0.25", features = ["tokio-comp"] }
deadpool-redis = "0.15"
sha2 = "0.10"
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sanitize-filename = "0.5"
sakina-fatwa-policy-gate = { path = "../sakina-wasm/fatwa-policy-gate" }
sakina-validator = { path = "../wasm" }
# Qdrant uses REST through reqwest to avoid the gRPC dependency tree.

[[bin]]
name = "sakina-api"
path = "src/main.rs"

[[bin]]
name = "sakina-ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "sakina-migrate"
path = "src/bin/migrate.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
