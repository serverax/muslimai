[package]
name = "sakina-backend"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.0"
opentelemetry-stdout = "0.32.0"
tracing-opentelemetry = "0.33.0"
# NOTE: thiserror, anyhow, qdrant-client, tonic, prost, sha2 were removed to keep
# the dependency tree compilable within this machine's memory. Re-add them per
# Phase 1/2 when their code lands (qdrant-client for guardrails, etc.), ideally
# building with `cargo check -j 2` to cap peak memory.

[[bin]]
name = "sakina-api"
path = "src/main.rs"

[[bin]]
name = "sakina-ingest"
path = "src/bin/ingest.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
