openapi: 3.0.3
info:
  title: Sakina Mobile Staging API
  version: 0.1.0-staging
servers:
  - url: https://api.sakina-mobile-staging.example
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service healthy
  /api/v1/modules:
    get:
      summary: List learning modules
      responses:
        '200':
          description: Module list
  /api/v1/chat:
    post:
      summary: Submit chat request with RAG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              required: [message]
      responses:
        '200':
          description: Assistant response
